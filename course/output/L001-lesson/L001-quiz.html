<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DigProg L01 · Quiz</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --ink: #0f172a;
      --muted: #64748b;
      --blue: #1d4ed8;
      --orange: #ea580c;
      --teal: #0f766e;
      --card: #fff;
      --ok: #15803d;
      --bad: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
    .badge {
      display: inline-block;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.75rem; margin: 0 0 8px; letter-spacing: -0.02em; }
    .obj { color: var(--muted); margin: 0 0 28px; line-height: 1.45; }
    .card {
      background: var(--card);
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 24px;
    }
    .prompt { font-size: 1.15rem; font-weight: 700; line-height: 1.4; margin-bottom: 18px; }
    .opt {
      display: block;
      width: 100%;
      text-align: left;
      margin: 0 0 10px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 2px solid #cbd5e1;
      background: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    .opt:hover:not(:disabled) { border-color: var(--blue); }
    .opt.selected { border-color: var(--blue); background: #eff6ff; }
    .opt:disabled { opacity: 0.85; cursor: default; }
    .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    button.primary {
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
    }
    button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
    button.ghost {
      background: transparent;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .feedback {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      line-height: 1.45;
      display: none;
    }
    .feedback.show { display: block; }
    .feedback.ok { background: #ecfdf5; border: 1px solid #86efac; color: var(--ok); }
    .feedback.bad { background: #fef2f2; border: 1px solid #fecaca; color: var(--bad); }
    .progress { color: var(--muted); font-size: 0.9rem; margin-bottom: 12px; }
    textarea {
      width: 100%;
      min-height: 110px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px;
      font: inherit;
      resize: vertical;
    }
    .rubric { margin-top: 14px; color: var(--muted); font-size: 0.95rem; }
    .rubric label { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
    .done { text-align: center; padding: 40px 20px; }
    .done h2 { margin: 0 0 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge">DigProg · L01 Quiz</div>
    <h1>What a business is</h1>
    <p class="obj">Objective: Identify the customer, offer, and delivery in a simple business example.</p>
    <div id="app"></div>
  </div>
  <script>
    const quiz = {
      questions: [
        {
          id: "q1",
          prompt: "Maya sells a $79 invoicing guide to freelance designers and sends buyers a download link. Which correctly identifies Customer → Offer → Delivery?",
          options: [
            { id: "A", text: "Maya → freelance designers → $79" },
            { id: "B", text: "Freelance designers → the $79 invoicing guide → download link" },
            { id: "C", text: "Download link → invoicing → freelance designers" }
          ],
          correct: "B",
          feedback: "The customer buys, the offer specifies what they receive and its price, and delivery provides access to it.",
          retry: {
            prompt: "Sam sells a $49 resume template to recent graduates and emails them a PDF. Which correctly identifies Customer → Offer → Delivery?",
            options: [
              { id: "A", text: "Sam → recent graduates → $49" },
              { id: "B", text: "Recent graduates → the $49 resume template → emailed PDF" },
              { id: "C", text: "Emailed PDF → resume → recent graduates" }
            ],
            correct: "B",
            feedback: "The customer buys, the offer specifies what they receive and its price, and delivery provides access to it."
          }
        },
        {
          id: "q2",
          prompt: "Leo builds an app. Friends praise it, but nobody has purchased access. What has he not yet demonstrated?",
          options: [
            { id: "A", text: "That he can build an app" },
            { id: "B", text: "That some people respond positively" },
            { id: "C", text: "That customers will actually pay for access" }
          ],
          correct: "C",
          feedback: "Positive feedback demonstrates interest. It does not demonstrate completed purchases.",
          retry: {
            prompt: "Nina posts free recipes. Followers leave glowing comments, but no one has bought her paid meal plan. What has she not yet demonstrated?",
            options: [
              { id: "A", text: "That she can create recipes" },
              { id: "B", text: "That some people respond positively" },
              { id: "C", text: "That customers will actually pay for the meal plan" }
            ],
            correct: "C",
            feedback: "Positive feedback demonstrates interest. It does not demonstrate completed purchases."
          }
        },
        {
          id: "q3",
          prompt: "A tutor identifies parents who want maths support and offers four lessons for $80, but has no way to schedule or conduct the lessons. Which part needs work?",
          options: [
            { id: "A", text: "Customer" },
            { id: "B", text: "Offer" },
            { id: "C", text: "Delivery" }
          ],
          correct: "C",
          feedback: "The customer and offer are specified. The tutor still needs a workable way to provide the promised lessons.",
          retry: {
            prompt: "A coach identifies busy managers who want interview practice and offers a $120 session, but has no booking link or meeting setup. Which part needs work?",
            options: [
              { id: "A", text: "Customer" },
              { id: "B", text: "Offer" },
              { id: "C", text: "Delivery" }
            ],
            correct: "C",
            feedback: "The customer and offer are specified. The coach still needs a workable way to provide the promised session."
          }
        }
      ]
    };

    const app = document.getElementById("app");
    let qi = 0;
    let selected = null;
    let submitted = false;
    let usingRetry = false;
    let score = 0;

    function currentQ() {
      const base = quiz.questions[qi];
      return usingRetry ? { ...base, ...base.retry, id: base.id + "-retry" } : base;
    }

    function renderMC() {
      const q = currentQ();
      app.innerHTML = `
        <div class="progress">Question ${qi + 1} of ${quiz.questions.length}${usingRetry ? " · retry" : ""}</div>
        <div class="card">
          <div class="prompt">${q.prompt}</div>
          <div id="opts"></div>
          <div class="actions">
            <button class="primary" id="submit" disabled>Submit</button>
            <button class="ghost" id="next" style="display:none">Continue</button>
          </div>
          <div class="feedback" id="fb"></div>
        </div>`;
      const opts = app.querySelector("#opts");
      q.options.forEach((o) => {
        const b = document.createElement("button");
        b.className = "opt";
        b.textContent = o.id + ". " + o.text;
        b.onclick = () => {
          if (submitted) return;
          selected = o.id;
          [...opts.children].forEach((c) => c.classList.remove("selected"));
          b.classList.add("selected");
          app.querySelector("#submit").disabled = false;
        };
        opts.appendChild(b);
      });
      app.querySelector("#submit").onclick = () => {
        if (!selected || submitted) return;
        submitted = true;
        const ok = selected === q.correct;
        const fb = app.querySelector("#fb");
        fb.className = "feedback show " + (ok ? "ok" : "bad");
        fb.textContent = (ok ? "Correct. " : "Not quite. ") + q.feedback;
        [...opts.children].forEach((c) => (c.disabled = true));
        app.querySelector("#submit").style.display = "none";
        const next = app.querySelector("#next");
        next.style.display = "inline-block";
        if (ok) {
          score += 1;
          next.textContent = "Continue";
          next.onclick = () => {
            qi += 1;
            selected = null;
            submitted = false;
            usingRetry = false;
            if (qi >= quiz.questions.length) renderApp();
            else renderMC();
          };
        } else if (!usingRetry) {
          next.textContent = "Try a similar scenario";
          next.onclick = () => {
            selected = null;
            submitted = false;
            usingRetry = true;
            renderMC();
          };
        } else {
          next.textContent = "Continue";
          next.onclick = () => {
            qi += 1;
            selected = null;
            submitted = false;
            usingRetry = false;
            if (qi >= quiz.questions.length) renderApp();
            else renderMC();
          };
        }
      };
    }

    function renderApp() {
      app.innerHTML = `
        <div class="progress">Scored questions: ${score} / ${quiz.questions.length}</div>
        <div class="card">
          <div class="prompt">Optional application</div>
          <p style="color:var(--muted);line-height:1.45">Name your customer, describe one offer with a price, and explain how you would deliver it.</p>
          <p style="color:var(--muted);font-size:0.95rem"><em>Example:</em> Busy freelancers buy my $79 invoicing guide and receive a download link.</p>
          <textarea id="appAns" placeholder="Write your answer…"></textarea>
          <div class="rubric">
            <strong>Self-check rubric (1 point each)</strong>
            <label><input type="checkbox" data-r="1" /> Specific customer</label>
            <label><input type="checkbox" data-r="1" /> Concrete offer with a price</label>
            <label><input type="checkbox" data-r="1" /> Feasible delivery method</label>
          </div>
          <div class="actions">
            <button class="primary" id="finish">Finish</button>
          </div>
        </div>`;
      app.querySelector("#finish").onclick = () => {
        const pts = [...app.querySelectorAll(".rubric input:checked")].length;
        app.innerHTML = `
          <div class="done card">
            <h2>Quiz complete</h2>
            <p>Multiple choice: <strong>${score} / ${quiz.questions.length}</strong></p>
            <p>Application self-score: <strong>${pts} / 3</strong></p>
            <p style="color:var(--muted)">Answers were only shown after you submitted each question.</p>
          </div>`;
      };
    }

    renderMC();
  </script>
</body>
</html>
